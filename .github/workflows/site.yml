# Publica o site da Tasca (pasta site/) no GitHub Pages.
# Corre a cada push para o main que mude o site ou os termos da app.
# Uma vez só: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/desktop/ui/termos.js"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Os termos vêm da app, para o site e a app mostrarem sempre o mesmo texto.
      - name: Copiar os termos da app
        run: cp apps/desktop/ui/termos.js site/assets/termos.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
