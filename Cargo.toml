[workspace]
resolver = "3"
members = ["crates/tasca-core", "crates/tasca-cli", "apps/desktop", "crates/tasca-servidor"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

# O Argon2 é muito lento sem otimizações; compila-o otimizado também em modo debug.
[profile.dev.package.argon2]
opt-level = 3
