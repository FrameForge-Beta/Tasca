[workspace]
resolver = "3"
members = ["crates/tasca-core", "crates/tasca-cli", "apps/desktop", "crates/tasca-servidor", "crates/tasca-voz"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

# O Argon2 é muito lento sem otimizações; compila-o otimizado também em modo debug.
[profile.dev.package.argon2]
opt-level = 3

# A supressão de ruído (DeepFilterNet, RNNoise) é demasiado lenta sem otimizações.
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-pulse]
opt-level = 3
[profile.dev.package.deep-filter-rt]
opt-level = 3
[profile.dev.package.nnnoiseless]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
