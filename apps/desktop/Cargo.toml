[package]
name = "tasca-app"
description = "Aplicação desktop da Tasca (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tasca-core = { path = "../../crates/tasca-core" }
anyhow = "1"
zeroize = "1"
getrandom = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
