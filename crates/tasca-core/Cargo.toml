[package]
name = "tasca-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
bip39 = "3.0.0"
blake3 = "1.8.7"
bytes = "1"
chacha20poly1305 = "0.11.0"
curve25519-dalek = "5"
data-encoding = "2.11.1"
getrandom = "0.4.3"
hex = "0.4.3"
iroh = "1.5"
postcard = { version = "1.1.3", features = ["use-std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"], optional = true }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
url = { version = "2.5.8", optional = true }
zeroize = "1.9.2"

# Android: autoridades de certificação embutidas (ver `http_builder` em lib.rs).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[features]
default = ["google", "servidor"]
# Login com Google e cópia da conta no Google Drive.
google = ["dep:reqwest", "dep:serde_json", "dep:url"]
# Cliente do servidor de contas (login com utilizador e palavra-passe).
servidor = ["dep:reqwest", "dep:serde_json", "dep:url"]
