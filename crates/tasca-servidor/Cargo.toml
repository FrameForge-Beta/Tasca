[package]
name = "tasca-servidor"
description = "Servidor de contas da Tasca: guarda só cofres encriptados"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tasca-core = { version = "0.1.0", path = "../tasca-core", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tasca-core = { path = "../tasca-core" }
